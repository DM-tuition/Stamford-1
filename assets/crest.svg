<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="Stamford House crest">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc3ef"/>
      <stop offset="0.45" stop-color="#3a97d6"/>
      <stop offset="1" stop-color="#1f6fb2"/>
    </linearGradient>
    <linearGradient id="royal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f63ff"/>
      <stop offset="1" stop-color="#1414c8"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3edf6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.45" stop-color="#b9c6d8"/>
      <stop offset="0.55" stop-color="#8d9bb0"/>
      <stop offset="1" stop-color="#5d6b80"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0f2"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ead0"/>
      <stop offset="1" stop-color="#d6bf8d"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#04081e" flood-opacity="0.45"/>
    </filter>
    <clipPath id="shield">
      <path d="M38,16 H202 V120 C202,182 162,218 120,236 C78,218 38,182 38,120 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#ds)">
    <!-- enamel field -->
    <g clip-path="url(#shield)">
      <rect x="0" y="0" width="240" height="260" fill="url(#white)"/>
      <!-- steel fesses -->
      <rect x="0" y="52"  width="240" height="34" fill="url(#steel)"/>
      <rect x="0" y="112" width="240" height="40" fill="url(#steel)"/>
      <rect x="0" y="178" width="240" height="30" fill="url(#steel)"/>
      <!-- royal chevron at the chief, holding the crown -->
      <polygon points="74,16 166,16 120,94" fill="url(#royal)"/>
      <!-- royal side chevrons -->
      <polygon points="38,116 66,142 38,168" fill="url(#royal)"/>
      <polygon points="202,116 174,142 202,168" fill="url(#royal)"/>
      <!-- royal diamond at the base -->
      <polygon points="120,184 144,210 120,236 96,210" fill="url(#royal)"/>
      <!-- glossy highlight sweep -->
      <ellipse cx="100" cy="34" rx="130" ry="70" fill="#ffffff" opacity="0.16"/>
      <polygon points="38,16 96,16 60,236 38,150" fill="#ffffff" opacity="0.06"/>
      <!-- crown -->
      <g transform="translate(120,50)" stroke="#1b2c66" stroke-width="1.2" stroke-linejoin="round">
        <path d="M-27 5 L-27 -9 L-17 0 L-9 -13 L0 -2 L9 -13 L17 0 L27 -9 L27 5 Z" fill="url(#crown)"/>
        <rect x="-27" y="5" width="54" height="7" rx="1.5" fill="url(#crown)"/>
        <circle cx="-27" cy="-11" r="2.6" fill="#fff"/>
        <circle cx="-9" cy="-15" r="2.6" fill="#fff"/>
        <circle cx="0" cy="-4" r="2.6" fill="#fff"/>
        <circle cx="9" cy="-15" r="2.6" fill="#fff"/>
        <circle cx="27" cy="-11" r="2.6" fill="#fff"/>
      </g>
    </g>

    <!-- metallic raised frame -->
    <path d="M38,16 H202 V120 C202,182 162,218 120,236 C78,218 38,182 38,120 Z"
          fill="none" stroke="url(#metal)" stroke-width="8"/>
    <path d="M38,16 H202 V120 C202,182 162,218 120,236 C78,218 38,182 38,120 Z"
          fill="none" stroke="#24304c" stroke-width="2"/>

    <!-- banner -->
    <g>
      <path d="M44,250 Q120,236 196,250 L196,272 Q120,286 44,272 Z" fill="url(#parch)" stroke="#8a6f37" stroke-width="1.5"/>
      <path d="M30,244 L48,252 L46,272 L28,266 Q36,256 30,244 Z" fill="#d8c089" stroke="#8a6f37" stroke-width="1.5"/>
      <path d="M210,244 L192,252 L194,272 L212,266 Q204,256 210,244 Z" fill="#d8c089" stroke="#8a6f37" stroke-width="1.5"/>
      <text x="120" y="267" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="21" letter-spacing="3" fill="#3a2f1a">STAMFORD</text>
    </g>
  </g>
</svg>
